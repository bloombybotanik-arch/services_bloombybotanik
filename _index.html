<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    
    <!-- FAVICONS (doivent être dans /public/) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#F9F9F7" />
    <title>Bloom by Botanik | Extraction de Précision & Totum</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Bloom by Botanik : L'extracteur botanique de précision pour maîtriser vos préparations maison. Totum végétal, séquençage A/B, extraction maîtrisée." />
    <meta property="og:title" content="Bloom by Botanik | Extraction de Précision & Totum" />
    <meta property="og:description" content="L'extracteur botanique de précision pour maîtriser vos préparations maison." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bloombybotanik.com" />
    <meta property="og:image" content="https://bloombybotanik.com/og-image.jpg" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preload critical assets (doivent être dans /public/) -->
    <link rel="preload" as="image" href="/images/hero-desktop.jpg" media="(min-width: 768px)" />
    <link rel="preload" as="image" href="/images/hero-mobile.jpg" media="(max-width: 767px)" />
    
    <style>
      body { 
        background: #F9F9F7; 
        margin: 0; 
        font-family: system-ui, -apple-system, sans-serif; 
      }
      .initial-loader { 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        width: 100vw; 
        background: #F9F9F7; 
      }
      .loader-logo { 
        width: 80px; 
        height: 80px; 
        opacity: 0.5; 
        animation: pulse 2s infinite; 
      }
      @keyframes pulse { 
        0%, 100% { opacity: 0.3; transform: scale(0.95); } 
        50% { opacity: 0.6; transform: scale(1); } 
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <img src="/logo_white.png" class="loader-logo" alt="Chargement Bloom..." />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
