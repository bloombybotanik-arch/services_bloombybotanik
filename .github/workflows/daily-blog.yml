name: Daily Blog Generation & Publication

on:
  schedule:
    - cron: '0 8 * * *' # Tous les matins à 8h
  workflow_dispatch: # Permet de lancer manuellement pour test

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Content with Gemini
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/generate-article.mjs > article.json
          # On extrait le titre et le contenu du JSON pour les mettre en variables d'env
          echo "POST_TITLE=$(jq -r .title article.json)" >> $GITHUB_ENV
          echo "POST_CONTENT=$(jq -r .content article.json)" >> $GITHUB_ENV

      - name: Publish to WordPress
        env:
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          POST_TITLE: ${{ env.POST_TITLE }}
          POST_CONTENT: ${{ env.POST_CONTENT }}
        run: node scripts/publish-to-wp.mjs
